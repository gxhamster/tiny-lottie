<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiny Lottie Debug Export</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --meta-padding: 0.5em;
      --meta-background-color: #FFFDF5;
      
      --type-text-bottom: -1.1em;
      --type-text-right:  0.5em;
        
      --prim-height: 35px;
      --float16-background: #ffbbc2;
      --float32-background: #bc99f9;
      --float64-background: #d791fd;
      --uint8-background:   #fb95cd;
      --uint16-background:  #FCB6C1;
      --uint32-background:  #fcb0ab;
      --uint64-background:  #fabca1;
      --int8-background:    #fcc494;
      --int16-background:   #fccf85;
      --int32-background:   #fdee74;
      --int64-background:   #CBDEA3;
      --flags-background:   #eeffc6;
      --bool-background:    #ebf577;
      --string-background:  #b4acf8;
      --enum-background:    #DEADB2;
      --varint-background:  #DEADB2;

      --float16-border-color: red;
      --float32-border-color: #520ccd;
      --float64-border-color: #8504cc;
      --uint8-border-color:   #CA0872;
      --uint16-border-color:  #F62E4C;
      --uint32-border-color:  #F7271A;
      --uint64-border-color:  #E44D0C;
      --int8-border-color:    #F98B2C;
      --int16-border-color:   #F9A51A;
      --int32-border-color:   #D4BD03;
      --int64-border-color:   #84A83B;
      --flags-border-color:   #2a3b00;
      --bool-border-color:    #9CA80C;
      --string-border-color:  #2110b6;
      --enum-border-color:    #BD5C66;
      --varint-border-color:  #BD5C66;
    }
    body {
      font-family: 'Courier New', monospace;
    }

    #root {
      padding: 2em;
      display: flex;
      max-width: 100vw;
      gap: 25px;
      flex-wrap: wrap;
    }

    .meta_content {
      display: flex;
      gap: 20px 10px;
      flex-wrap: wrap;
    }
    .meta_title {
      text-transform: uppercase;
      display: flex;
      letter-spacing: 1px;
      justify-content: space-between;
      margin-bottom: 1px;
    }
    .meta_title .bit_count {
      text-transform: uppercase;
      font-size: x-small;
      font-weight: bold;
    }
    .meta {
      position: relative;
      background-color: var(--meta-background-color);
      display: flex;
      flex-direction: column;
      padding: var(--meta-padding);
      border: 3.0px solid #575349;
    }

    .varint {
      position: relative;
      padding: 0.5em;
      text-align: center;
      line-height: var(--prim-height);
      min-width: var(--prim-height);
      height: var(--prim-height);
      border: 3px solid var(--varint-border-color);
      text-transform: lowercase;
      background-color: var(--varint-background);
      letter-spacing: -0.5px;
      font-size: large;
    }
    .varint::after {
      content: "varint";
      font-size: x-small;
      position: absolute;
      bottom: var(--type-text-bottom);
      font-weight: bold;
      text-transform: uppercase;
      left: var(--type-text-right);
    }

    .flags {
      text-align: center;
      position: relative;
      padding: 0.5em;
      height: var(--prim-height);
      border: 3px solid var(--flags-border-color);
      background-color: var(--flags-background);
      display: flex;
      gap: 15px;
      line-height: var(--prim-height);
      font-size: large;
    }
    .flags::after {
      content: "flags";
      font-size: x-small;
      position: absolute;
      bottom: var(--type-text-bottom);
      font-weight: bold;
      text-transform: uppercase;
      left: var(--type-text-right);
    }

    .float16 {
      position: relative;
      padding: 0.5em;
      text-align: center;
      line-height: var(--prim-height);
      height: var(--prim-height);
      border: 3px solid var(--float16-border-color);
      text-transform: lowercase;
      background-color: var(--float16-background);
      letter-spacing: -0.5px;
      font-size: large;
    }
    .float16::after {
      content: "f16";
      font-size: x-small;
      position: absolute;
      bottom: var(--type-text-bottom);
      font-weight: bold;
      text-transform: uppercase;
      left: var(--type-text-right);
    }

      text-transform: lowercase;

      letter-spacing: -0.5px;
      font-size: large;
    }
    .float64::after {

      text-transform: uppercase;

    }

    .uint8 {
      position: relative;
      padding: 0.5em;
      text-align: center;
      line-height: var(--prim-height);
      width: var(--prim-height);
      height: var(--prim-height);
      border: 3px solid var(--uint8-border-color);
      text-transform: lowercase;
      background-color: var(--uint8-background);
      letter-spacing: -0.5px;
      font-size: large;
    }
    .uint8::after {
      content: "u8";

      position: absolute;
      bottom: var(--type-text-bottom);
      font-weight: bold;
      text-transform: uppercase;

    }

    .uint16 {

      text-align: center;
      line-height: var(--prim-height);
      height: var(--prim-height);
      border: 3px solid var(--uint16-border-color);
      text-transform: lowercase;

    .uint32 {

      border: 3px solid var(--uint32-border-color);
      text-transform: lowercase;

    }
    .uint32::after {

      position: absolute;
      bottom: var(--type-text-bottom);
      font-weight: bold;
      text-transform: uppercase;
      left: var(--type-text-right);
    }

    .uint64 {
      position: relative;
      padding: 0.5em;
      text-align: center;
      line-height: var(--prim-height);

      border: 3px solid var(--uint64-border-color);
      text-transform: lowercase;
      background-color: var(--uint64-background);
      letter-spacing: -0.5px;
      font-size: large;
    }
    .uint64::after {
      content: "u64";

      position: absolute;
      bottom: var(--type-text-bottom);
      font-weight: bold;
      text-transform: uppercase;
      left: var(--type-text-right);
    }

    .int8 {
      position: relative;
      padding: 0.5em;
      text-align: center;
      line-height: var(--prim-height);
      width: var(--prim-height);
      height: var(--prim-height);
      border: 3px solid var(--int8-border-color);
      text-transform: lowercase;
      background-color: var(--int8-background);
      letter-spacing: -0.5px;
      font-size: large;
    }
    .int8::after {
      content: "i8";
      font-size: x-small;
      position: absolute;
      bottom: var(--type-text-bottom);

    }

    .int16 {

    }
    .int32::after {

    .int64 {

    }
    .int64::after {

      bottom: var(--type-text-bottom);

      left: var(--type-text-right);
    }
    .bool {
      padding: 0.5em;
      position: relative;
      text-align: center;
      height: var(--prim-height);
      line-height: var(--prim-height);
      width: var(--prim-height);
      border: 3px solid var(--bool-border-color);
      background-color: var(--bool-background);
      font-size: large;
    }
    .bool::after {
      content: "bool";
      font-size: x-small;
      position: absolute;
      bottom: var(--type-text-bottom);
      font-weight: bold;
      text-transform: uppercase;
      left: var(--type-text-right);
    }

    .string {
      padding: 0.5em;
      position: relative;
      text-align: left;
      line-height: var(--prim-height);
      min-height: var(--prim-height);
      border: 3px solid var(--string-border-color);
      background-color: var(--string-background);
      font-size: large;
    }
    .string::after {
      content: "string";
      font-size: x-small;
      position: absolute;
      bottom: var(--type-text-bottom);
      font-weight: bold;
      text-transform: uppercase;
      left: var(--type-text-right);
    }

  </style>
</head>
<body>
    <!-- Visible content goes here -->
    <div id="root">
      <div class="meta">
        <div class="meta_title">PropVector</div>
        <div class="meta_content">
          <div class="string">vector1</div>
          <div class="bool">0</div>
          <div class="meta">
            <div class="meta_title">
              <span>vector3</span>
              <span class="bit_count">26 bits</span>
            </div>
            <div class="meta_content">
              <div class="float16">F0 1E</div>
              <div class="float16">4d c2</div>
              <div class="float16">51 ce</div>
            </div>
          </div>
          <div class="bool">0</div>
          <div class="flags">
            <span>1</span>
            <span>1</span>
            <span>0</span>
          </div>
          <div class="float64">F0 1E 0a 0b 0c 1a 1b 1c</div>
          <div class="float32">4d c2 0b</div>
          <div class="float32">51 ce 0c</div>
          <div class="string">ending string here</div>
          <div class="flags">
            <span>0</span>
            <span>1</span>
            <span>1</span>
            <span>0</span>
          </div>
          <div class="uint8">4d</div>
          <div class="uint16">4d 1c</div>
          <div class="uint32">4d 1c 00 de</div>
          <div class="uint64">4d 1c 00 de 00 00 00 01</div>
          <div class="int8">4d</div>
          <div class="int16">4d 1c</div>
          <div class="int32">4d 1c 00 de</div>
          <div class="int64">4d 1c 00 de 00 00 00 01</div>
        </div>
      </div>
    </div>
    <script defer type="text/javascript">
      const template = `<div class="meta">
        <div class="meta_title">PropVector</div>
        <div class="meta_content">
          <div class="string">here lies the string</div>
          <div class="bool">0</div>
          <div class="meta">
            <span class="meta_title">vector3</span>
            <div class="meta_content">
              <div class="float">1.23</div>
              <div class="float">2.23</div>
              <div class="float">3.23</div>
            </div>
          </div>
          <div class="bool">0</div>
          <div class="flags">
            <span>1</span>
            <span>1</span>
            <span>0</span>
          </div>
          <div class="float">1.23</div>
          <div class="float">2.23</div>
          <div class="float">3.23</div>
        </div>
      </div>`
      const root = document.getElementById("root");
      for (let i = 0; i < 0; i++) {
        const cont = document.createElement("template");
        cont.innerHTML = template.trim();
        root.appendChild(cont.content.firstChild)
      }
    </script>
</body>
</html>
